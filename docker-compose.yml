services:
  postgres:
    image: postgres:16-alpine
    container_name: schemalens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schemalens
      POSTGRES_USER: schemalens
      POSTGRES_PASSWORD: schemalens
    ports:
      - "5432:5432"
    volumes:
      - schemalens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemalens -d schemalens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: schemalens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - schemalens_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schemalens_postgres_data:
  schemalens_redis_data:
